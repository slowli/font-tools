[workspace]
members = ["crates/font-subset", "crates/font-subset-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Alex Ostrovski <ostrovski.alex@gmail.com>"]
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/slowli/font-tools"

[workspace.dependencies]
# External dependencies
allsorts = "0.16.1"
anstream = "1"
anstyle = "1.0.14"
anyhow = "1.0"
assert_matches = "1.5.0"
brotli = { version = "8", default-features = false }
chrono = "0.4.44"
clap = "4.6.0"
doc-comment = "0.3.4"
tempfile = "3.27.0"
term-transcript = { version = "=0.5.0-beta.1", git = "https://github.com/slowli/term-transcript.git", rev = "27aad1beaadddde81255ea78b0353d4938fb898c" }
test-casing = "=0.2.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
version-sync = "0.9.5"

# Internal dependencies
font-subset = { version = "0.1.0", path = "crates/font-subset" }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"

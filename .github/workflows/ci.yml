name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  msrv: 1.86.0
  nightly: nightly-2025-11-02

jobs:
  build-msrv:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.msrv }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-cargo

      - name: Run tests
        run: cargo test --workspace --all-features --all-targets

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install OTS
        run: |
          sudo apt-get install -y --no-install-suggests --no-install-recommends opentype-sanitizer
          ots-sanitize --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny
          version: "^0.18"

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo

      - name: Format
        run: cargo fmt --all -- --check --config imports_granularity=Crate --config group_imports=StdExternalCrate
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Clippy (no WOFF2)
        run: cargo clippy -p font-subset --lib -- -D warnings
      - name: Clippy (no-std)
        run: cargo clippy -p font-subset --no-default-features --lib -- -D warnings
      - name: Clippy (no-std, WOFF2)
        run: cargo clippy -p font-subset --no-default-features --features woff2 --lib -- -D warnings

      - name: Check dependencies
        run: cargo deny --workspace --all-features check

      - name: Run tests
        run: cargo test --workspace --all-features --all-targets
        env:
          OTS_SANITIZER: ots-sanitize
      - name: Run doc tests
        run: cargo test --workspace --all-features --doc

      - name: Check CLI
        run: |
          cargo run --bin font-subset -- --help
          cargo run --bin font-subset -- info crates/font-subset/examples/FiraMono-Regular.ttf

          RUST_LOG=info,font_subset=debug \
          cargo run --bin font-subset --all-features -- subset --ascii --format woff2 -o /dev/null \
            crates/font-subset/examples/FiraMono-Regular.ttf

  build-nightly:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.nightly }}
          targets: thumbv7m-none-eabi

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-nightly-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-nightly-cargo

      - name: Build font-subset
        run: cargo build -p font-subset --lib --no-default-features --features woff2 -Z avoid-dev-deps

      - name: Build docs
        run: |
          cargo clean --doc && \
          cargo rustdoc -p font-subset --all-features -- -D warnings --cfg docsrs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref_type == 'branch'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          path: 'target/doc'

  deploy-pages:
    needs:
      - build
      - build-msrv
      - build-nightly
    if: github.event_name == 'push' && github.ref_type == 'branch'
    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
